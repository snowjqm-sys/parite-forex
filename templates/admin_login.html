{% extends "base.html" %}
{% block title %}管理员登录{% endblock %}

{% block content %}
<div class="page-header">
    <h1>管理员登录</h1>
    <p class="subtitle">AI 配置与管理员设置需要登录</p>
</div>

<div class="card" style="max-width:420px;margin:32px auto;">
    {% if error %}
    <div class="callout danger" style="margin-bottom:16px;">
        <div class="callout-title">登录失败</div>
        {{ error }}
    </div>
    {% endif %}
    <form method="POST" action="{{ url_for('admin_login') }}">
        <div class="feedback-form">
            <div class="form-row">
                <label for="password">管理员密码</label>
                <input type="password" id="password" name="password" placeholder="请输入管理员密码" autofocus required>
            </div>
            <div class="form-row">
                <button type="submit" class="green">登录</button>
                <a href="{{ url_for('index') }}" class="link-btn" style="margin-left:12px;">返回首页</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
