# ============================================================
# parite.top Nginx 反向代理配置
# 部署路径: /etc/nginx/conf.d/parite-top.conf
# 架构: 国内用户 → 香港 VPS (Nginx) → Vercel 源站
# ============================================================

# DNS 解析器（用于动态解析 Vercel IP，避免 Nginx 启动时缓存过期 IP）
# 香港 VPS 用 8.8.8.8 + 1.1.1.1 即可，valid=300s 表示每 5 分钟刷新一次
resolver 8.8.8.8 1.1.1.1 valid=300s;
resolver_timeout 5s;

# ------------------------------------------------------------
# HTTP 80 端口：仅用于 Let's Encrypt 验证 + 跳转 HTTPS
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name parite.top www.parite.top;

    # Let's Encrypt HTTP-01 验证路径（certbot 会在此目录放验证文件）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余请求全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------
# HTTPS 443 端口：主反向代理
# ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name parite.top www.parite.top;

    # --- 根域名跳转 www ---
    if ($host = parite.top) {
        return 301 https://www.parite.top$request_uri;
    }

    # --- SSL 证书（由 certbot 自动管理）---
    ssl_certificate     /etc/letsencrypt/live/www.parite.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.parite.top/privkey.pem;

    # --- SSL 优化 ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- OCSP 装订（加速证书验证，减少客户端延迟）---
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- 安全头 ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- 反向代理核心配置 ---

    # 动态上游变量（配合 resolver 实现运行时 DNS 解析）
    set $vercel_backend "cname.vercel-dns.com";

    # 代理通用设置
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host www.parite.top;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 上游 SSL（Nginx → Vercel 的加密）
    proxy_ssl_server_name on;
    proxy_ssl_name www.parite.top;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;

    # 超时设置（Vercel 冷启动可能需要几秒，适当放宽）
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # 缓冲区
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;

    # --- 路由规则 ---

    # 静态资源缓存（CSS/JS/图片/字体）
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        proxy_pass https://$vercel_backend;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # 健康检查端点（不转发到 Vercel，直接返回）
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 主代理：所有其他请求转发到 Vercel
    location / {
        proxy_pass https://$vercel_backend;
    }
}
